name: Refresh roster

# Rebuilds docs/fallback-repos.js (the live repo + release-download roster) using the
# auto-generated GITHUB_TOKEN. Runs every 15 minutes + on every push to main + on
# a release event in this org, so the published site is always fresh without the
# browser ever calling the GitHub API (unauth = 60/h per visitor IP = 403 flood).
#
# GITHUB_TOKEN is NOT a stored repo secret - GitHub mints it per workflow run,
# scoped to this repo only, and discards it at run end. 5000/h rate limit.

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths-ignore:
      # This workflow's own refresh commit only touches these generated files. Ignoring them stops the
      # bot push from re-triggering the workflow (self-loop). The old loop-breaker was a CI-skip marker in
      # the commit message, but Cloudflare Pages honours that marker too and then never deployed the update.
      # The schedule + workflow_dispatch below still drive every refresh.
      - 'docs/fallback-repos.js'
      - 'docs/index.html'
      - 'docs/app.js'
      - 'docs/cards-data.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-roster
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history -> git rev-list --count = the real commit count (cache-buster uses the same source as the build version; a shallow clone made ?v= a constant v2)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate, commit and push
        # The concurrency group above should serialize runs, but overlapping schedule/push/dispatch
        # triggers can still race the final push (two runs edit the same ?v=/BUILD cache lines, so a
        # plain rebase would conflict). Instead of failing, each attempt rebuilds on the very latest
        # main and pushes; if another run pushed in between (non-fast-forward), we reset to the new tip
        # and retry. This keeps the roster fresh without the recurring "failed to push some refs" emails.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "Laufbursche42"
          git config user.email "265699245+Laufbursche42@users.noreply.github.com"
          result=""
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            node scripts/gen-fallback.js
            if git diff --quiet -- docs/fallback-repos.js; then
              echo "no roster change (attempt $attempt)"
              result="nochange"
              break
            fi
            # Cache-buster V = git commit count (+1 for this commit) - the SAME source as the Android build
            # version. fetch-depth:0 above makes this the real count, so ?v= + BUILD rise monotonically and
            # the browser/CDN always refetch; the old shallow clone pinned it to a constant v2.
            V=$(( $(git rev-list --count HEAD) + 1 ))
            sed -i -E "s/\?v=[0-9]+/?v=$V/g" docs/index.html
            sed -i -E "s/(BUILD[[:space:]]*=[[:space:]]*['\"])v[0-9]+(['\"])/\1v$V\2/" docs/app.js
            git add docs/fallback-repos.js docs/index.html docs/app.js
            git commit -m "chore: refresh roster + cache-bust v$V"
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              result="pushed"
              break
            fi
            echo "push rejected (attempt $attempt) - another run pushed first; rebuilding on latest main"
            sleep $(( (RANDOM % 4) + 2 ))
          done
          if [ -z "$result" ]; then
            echo "still failing after retries"
            exit 1
          fi
